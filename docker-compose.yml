services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: expense-dashboard-frontend:latest
    container_name: expense-dashboard-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-dashboard-api:latest
    container_name: expense-dashboard-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      MONGO_DB: ${MONGO_DB:-expense_dashboard}
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-expense_user}:${MONGO_INITDB_ROOT_PASSWORD:-expense_pass}@mongodb:27017/${MONGO_DB:-expense_dashboard}?authSource=admin
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:7
    container_name: expense-dashboard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-expense_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-expense_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-expense_dashboard}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''db.adminCommand("ping").ok'' mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin | grep 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
    name: expense_dashboard_mongodb_data
